name: Release

# Builds an Arch package + plain tarball. On a tag (v0.2.0 or 0.2.0), or on a
# push to main whose version already has a tag, they are attached to that
# tag's GitHub release.
on:
  push:
    tags: ["v*", "[0-9]*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs pnpm pkgconf clang \
            pipewire pipewire-audio lsp-plugins-lv2 webkit2gtk-4.1 gtk3 libayatana-appindicator
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick release tag
        id: tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            V=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
            TAG=$(git tag -l "v$V" "$V" | head -1)
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: ${TAG:-none (artifacts only)}"
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" packaging/release/PKGBUILD
          fi
          cd packaging/release
          sudo -u builder env HOME=/home/builder makepkg --nodeps --noconfirm
      - name: Tarball
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
          D=linuxmeeter-$VERSION-x86_64
          mkdir -p $D
          bsdtar -xf packaging/release/linuxmeeter-*.pkg.tar.zst -C $D usr
          cp README.md LICENSE $D/
          tar czf $D.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: linuxmeeter
          path: |
            packaging/release/linuxmeeter-*.pkg.tar.zst
            linuxmeeter-*-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.name != ''
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            packaging/release/linuxmeeter-*.pkg.tar.zst
            linuxmeeter-*-x86_64.tar.gz
          body: |
            Fork of [dslapelis/linuxmeeter](https://github.com/dslapelis/linuxmeeter) with:

            - **Rename strips and buses** (double-click the name). Other programs see the new device name; streams using it are moved back after the rename.
            - **Profile switching**: switch, save as new, delete from the top bar.
            - **Desktop notifications** for profile switches and shortcut actions, also while the window is hidden.
            - **Global shortcuts** via `linuxmeeter ctl toggle-mute|volume-up|volume-down <channel>`, `ctl profile-next`, … Settings (gear icon) lists the command for every strip and bus.

            Arch: `sudo pacman -U linuxmeeter-*.pkg.tar.zst`
            Needs PipeWire (`pipewire-audio`) with WirePlumber, `lsp-plugins-lv2`, `webkit2gtk-4.1`, `gtk3`, `libayatana-appindicator`.
