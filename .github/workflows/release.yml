name: Release

# Builds an Arch package + plain tarball and publishes them as a GitHub
# release. A push to main whose version (pkgver in packaging/release/PKGBUILD)
# has no release yet creates tag + release; a later push of the same version,
# or pushing a tag, updates that release's files. Notes: packaging/release/NOTES.md.
on:
  push:
    tags: ["v*", "[0-9]*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs pnpm pkgconf clang \
            pipewire pipewire-audio lsp-plugins-lv2 webkit2gtk-4.1 gtk3 libayatana-appindicator
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick release tag
        id: tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            V=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
            TAG=$(git tag -l "v$V" "$V" | head -1)
            # A new version on main: release it.
            if [ -z "$TAG" ] && [ "$GITHUB_REF" = refs/heads/main ]; then TAG="$V"; fi
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: ${TAG:-none (artifacts only)}"
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" packaging/release/PKGBUILD
          fi
          cd packaging/release
          sudo -u builder env HOME=/home/builder makepkg --nodeps --noconfirm
      - name: Tarball
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
          D=linuxmeeter-$VERSION-x86_64
          mkdir -p $D
          bsdtar -xf packaging/release/linuxmeeter-*.pkg.tar.zst -C $D usr
          cp README.md LICENSE $D/
          tar czf $D.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: linuxmeeter
          path: |
            packaging/release/linuxmeeter-*.pkg.tar.zst
            linuxmeeter-*-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.name != ''
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            packaging/release/linuxmeeter-*.pkg.tar.zst
            linuxmeeter-*-x86_64.tar.gz
          name: linuxmeeter ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: packaging/release/NOTES.md
