name: Release

# Builds an Arch package + plain tarball.
#
# Every push to main is published to the rolling "edge" pre-release (fixed
# file names plus linuxmeeter-edge-arch.sha, which the in-app updater reads),
# with package version <pkgver>.r<commit count> so each build is newer than
# the last. A push to main whose pkgver (packaging/release/PKGBUILD) has no
# release yet also creates that release; notes: packaging/release/NOTES.md.
on:
  push:
    tags: ["v*", "[0-9]*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs pnpm pkgconf clang \
            pipewire pipewire-audio lsp-plugins-lv2 webkit2gtk-4.1 gtk3 libayatana-appindicator
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick release tag
        id: tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            V=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
            TAG=$(git tag -l "v$V" "$V" | head -1)
            # Already released from an earlier commit: this push only goes to edge.
            if [ -n "$TAG" ] && [ "$(git rev-list -n1 "$TAG")" != "$GITHUB_SHA" ]; then TAG=""
            # A new version on main: release it.
            elif [ -z "$TAG" ] && [ "$GITHUB_REF" = refs/heads/main ]; then TAG="$V"; fi
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: ${TAG:-none (artifacts only)}"
          V=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
          if [ "$GITHUB_REF_TYPE" = tag ]; then BUILD="${GITHUB_REF_NAME#v}"; else BUILD="$V.r$(git rev-list --count HEAD)"; fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "build version: $BUILD"
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sed -i "s/^pkgver=.*/pkgver=${{ steps.tag.outputs.build }}/" packaging/release/PKGBUILD
          cd packaging/release
          sudo -u builder env HOME=/home/builder \
            LM_BUILD_SHA="$GITHUB_SHA" LM_BUILD_VERSION="${{ steps.tag.outputs.build }}" \
            makepkg --nodeps --noconfirm
      - name: Tarball
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
          D=linuxmeeter-$VERSION-x86_64
          mkdir -p $D
          bsdtar -xf packaging/release/linuxmeeter-*.pkg.tar.zst -C $D usr
          cp README.md LICENSE $D/
          tar czf $D.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: linuxmeeter
          path: |
            packaging/release/linuxmeeter-*.pkg.tar.zst
            linuxmeeter-*-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.name != ''
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            packaging/release/linuxmeeter-*.pkg.tar.zst
            linuxmeeter-*-x86_64.tar.gz
          name: linuxmeeter ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: packaging/release/NOTES.md
      - name: Edge files
        if: github.ref == 'refs/heads/main'
        run: |
          cp packaging/release/linuxmeeter-*.pkg.tar.zst linuxmeeter-edge-x86_64.pkg.tar.zst
          echo "$GITHUB_SHA ${{ steps.tag.outputs.build }}" > linuxmeeter-edge-arch.sha
          printf 'Rolling build of the newest commit on main, for the in-app updater (Settings → Updates → "every push to main").\n\nNot a release: use at your own risk; the regular releases are below.\n' > edge-notes.md
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: edge
          name: linuxmeeter edge (newest main)
          prerelease: true
          make_latest: false
          body_path: edge-notes.md
          files: |
            linuxmeeter-edge-x86_64.pkg.tar.zst
            linuxmeeter-edge-arch.sha
