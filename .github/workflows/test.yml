name: Test

# Unit tests plus `make test-audio`: real PipeWire with the real LSP plugins
# (gate, compressor, 16-band EQ, limiter), which a plain Ubuntu runner lacks.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rust clang pkgconf pipewire pipewire-audio lsp-plugins-lv2 nodejs pnpm
      - uses: actions/checkout@v4
      - name: Unit tests (Rust)
        run: cargo test -p lm-protocol -p lm-engine
      - name: Unit tests (frontend)
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false && pnpm test
      - name: Audio integration tests
        run: ./scripts/with-test-daemon.sh cargo test -p lm-engine --test audio -- --ignored --test-threads=1
