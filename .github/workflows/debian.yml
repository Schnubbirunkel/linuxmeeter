name: Debian

# Does linuxmeeter run on Debian? Real PipeWire + LSP plugins in a Debian
# container, the same audio integration tests as on Arch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential clang libclang-dev pkg-config \
            pipewire pipewire-bin libpipewire-0.3-dev libspa-0.2-dev libspa-0.2-modules \
            lsp-plugins-lv2 liblilv-0-0
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      - name: Diagnostics
        run: |
          dpkg -l | grep -E "pipewire|libspa|lilv|lsp-plugins" | awk '{print $2, $3}'
          ls /usr/lib/x86_64-linux-gnu/spa-0.2/filter-graph/ || true
          apt-cache search pipewire | sort
          apt-cache search lv2 | grep -i -E "pipewire|spa|filter" || true
          ldd /usr/lib/x86_64-linux-gnu/spa-0.2/filter-graph/libspa-filter-graph.so | grep -i -E "lilv|lv2" || echo "filter-graph does not link lilv"
      - name: Audio integration tests
        run: |
          . "$HOME/.cargo/env"
          export RUST_BACKTRACE=1 PIPEWIRE_DEBUG=2
          ./scripts/with-test-daemon.sh cargo test -p lm-engine --test audio -- --ignored --test-threads=1 --nocapture 2>&1 | tail -150
