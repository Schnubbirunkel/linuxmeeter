name: Debian

# Build linuxmeeter on Debian, package it as a .deb, install that with apt,
# and smoke-test it like a desktop: PipeWire + WirePlumber, a tone through a
# strip into a virtual microphone, real LSP plugins. On main, the .deb is
# attached to the release for the current version.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential clang libclang-dev pkg-config dpkg-dev file \
            libpipewire-0.3-dev libspa-0.2-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev nodejs npm
          npm install -g pnpm@10
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          V=$(sed -n 's/^pkgver=//p' packaging/release/PKGBUILD)
          N=$(git rev-list --count HEAD)
          echo "release=$V" >> "$GITHUB_OUTPUT"
          echo "build=$V.r$N" >> "$GITHUB_OUTPUT"
          echo "deb=$V+r$N" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          LM_BUILD_SHA: ${{ github.sha }}
          LM_BUILD_VERSION: ${{ steps.ver.outputs.build }}
        run: |
          . "$HOME/.cargo/env"
          pnpm install --frozen-lockfile --config.strict-dep-builds=false
          pnpm tauri build --no-bundle
      - name: Package
        id: deb
        run: |
          DEB=$(packaging/debian/build-deb.sh "${{ steps.ver.outputs.deb }}" | tail -1)
          echo "path=$DEB" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.ver.outputs.release }}" >> "$GITHUB_OUTPUT"
          dpkg-deb -I "$DEB"
      - name: Install with apt (checks the dependencies resolve)
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y "${{ steps.deb.outputs.path }}" xvfb dbus python3
      - name: Smoke test
        run: dbus-run-session -- packaging/debian/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linuxmeeter-deb
          path: ${{ steps.deb.outputs.path }}
      - name: Is this version released?
        id: rel
        if: github.ref == 'refs/heads/main'
        run: |
          # The Release workflow creates the release for a new version; attach
          # to it only if it exists or is being created for this commit.
          if git tag -l "${{ steps.deb.outputs.version }}" | grep -q . ; then
            [ "$(git rev-list -n1 "${{ steps.deb.outputs.version }}")" = "$GITHUB_SHA" ] && echo "attach=yes" >> "$GITHUB_OUTPUT" || true
          else
            echo "attach=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach to the release
        if: steps.rel.outputs.attach == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.deb.outputs.version }}
          files: ${{ steps.deb.outputs.path }}
      - name: Edge files
        if: github.ref == 'refs/heads/main'
        run: |
          cp "${{ steps.deb.outputs.path }}" linuxmeeter-edge_amd64.deb
          echo "$GITHUB_SHA ${{ steps.ver.outputs.build }}" > linuxmeeter-edge-debian.sha
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: edge
          name: linuxmeeter edge (newest main)
          prerelease: true
          make_latest: false
          files: |
            linuxmeeter-edge_amd64.deb
            linuxmeeter-edge-debian.sha
