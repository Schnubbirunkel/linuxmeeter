[package]
name = "linuxmeeter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VoiceMeeter-style virtual audio mixer for Linux (PipeWire)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
lm-protocol = { path = "../crates/lm-protocol" }
lm-engine = { path = "../crates/lm-engine" }
pipewire = "0.10"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify-rust = "4"
toml.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
tokio = { version = "1", features = ["sync", "net", "rt", "macros"] }
